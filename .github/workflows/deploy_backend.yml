name: Deploy to Backend VPS

on:
  workflow_dispatch:
  # Uncomment the below to enable auto-deploy on push
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'packages/api/**'
  #     - 'packages/bot/**'

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up SSH key
        run: |
          echo "=== [DEBUG] Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Execute deployment via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << EOF
            set -e
            echo "=== [DEBUG] Date: \$(date) ==="
            cd \$PROJECT_DIR
            echo "=== [DEBUG] Syncing with remote repository... ==="
            time git pull origin main
            echo "=== [DEBUG] Rebuilding docker containers... ==="
            time docker compose -f docker-compose.prod.yml up --build -d
            echo "=== [DEBUG] Checking running containers... ==="
            docker ps -a
          EOF
