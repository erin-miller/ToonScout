name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check api syntax
        run: npm run check --workspace=packages/api

      - name: Check bot syntax
        run: npm run check --workspace=packages/bot

      - name: Build webapp
        run: npm run build --workspace=packages/webapp
