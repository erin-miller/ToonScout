services:
  bot:
    container_name: ts-bot
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - .env:/app/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .git/
        - action: rebuild
          path: package.json
